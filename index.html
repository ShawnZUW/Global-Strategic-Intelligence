<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球战略情报中心</title><style>body{background:#0b1524;color:#e4edf8;font:16px system-ui;margin:0}main{max-width:1200px;margin:auto;padding:28px}small,p{color:#a8bdd3;line-height:1.7}h1{font-size:clamp(25px,4vw,42px)}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article{background:#14263c;border:1px solid #304962;padding:20px;border-radius:12px}a{color:#83caff}button,input{background:#182e46;color:white;border:1px solid #45617e;padding:10px;border-radius:6px;margin:4px}button{cursor:pointer}</style><main><small>GLOBAL STRATEGIC INTELLIGENCE / PUBLIC DATA POC</small><h1>全球战略情报与投后监控中心</h1><p>公开信息研究原型 · 非企业官方系统 · 尚未接入每日数据流。以下为常设监控方向及官方信源入口，不代表已核实的最新事件。</p><input id="q" placeholder="搜索监控领域"><nav id="nav"></nav><section id="out"></section></main><script>const d=[['资源与矿权','锂、镍、钴、石墨、铜；矿权、许可、资源量、复产、包销','https://www.usgs.gov/centers/national-minerals-information-center'],['原材料价格','价格异常、库存、期现价差','https://www.metal.com/'],['供需平衡','产量、有效产能、需求、供给短缺与过剩','https://www.iea.org/'],['地缘与航运','冲突、港口、海峡、运输风险','https://portwatch.imf.org/'],['贸易与政策','关税、出口限制、本地化要求','https://www.wto.org/'],['技术突破','固态、钠电、硅碳、直接提锂、干法电极','https://www.energy.gov/'],['竞争与合作','竞争对手产能、订单、合资及技术授权','https://www.sec.gov/edgar/search/'],['法人治理','董事任免、股权、注册状态','https://find-and-update.company-information.service.gov.uk/'],['矿山零碳','微电网、储能、矿卡换电','https://www.iea.org/']];let t='全部';for(const n of ['全部',...d.map(x=>x[0])]){let b=document.createElement('button');b.textContent=n;b.onclick=()=>{t=n;render()};nav.append(b)}function render(){out.replaceChildren();for(const x of d.filter(x=>(t==='全部'||x[0]===t)&&x.join(' ').includes(q.value))){let a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),l=document.createElement('a');h.textContent=x[0];p.textContent=x[1];l.href=x[2];l.textContent='公开信源入口';a.append(h,p,l);out.append(a)}}q.oninput=render;render()</script></html>
